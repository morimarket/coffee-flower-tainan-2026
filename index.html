<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 珈琲と花物語南迴篇｜品牌地圖 Brand Map</title>
<meta name="description" content="森ノ市 2026 珈琲と花物語 TAINAN 線上品牌地圖：依分區瀏覽參展品牌、查詢攤位編號與位置。11/20–11/22 台南水交社文化園區。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3E8; --paper2:#EFE8DA; --ink:#1A1A1A; --ink2:#5B564D; --muted:#8C857A;
  --orange:#E0603A; --yellow:#F2C94C; --beige:#CDBFA6;
  --r:14px; --shadow:0 2px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.num{font-family:"Space Grotesk","Noto Sans TC",sans-serif;font-weight:700;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--paper);border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.brand small{font-weight:500;color:var(--ink2)}
.brand-logo{display:block;height:28px;width:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em}
.spacer{flex:1}
.meta{font-size:13px;color:var(--ink2);white-space:nowrap}
.jump{border:2px solid var(--ink);background:var(--yellow);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.jump:active{transform:translateY(2px);box-shadow:none}

.hero{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:40px;align-items:center;max-width:1180px;margin:0 auto;padding:36px 24px 28px}
.hero img{width:100%;height:auto;display:block;border:2px solid var(--ink);border-radius:18px;background:#fff}
.hero h1 .nw{white-space:nowrap}
.hero h1{font-size:clamp(26px,3.1vw,40px);line-height:1.2;margin:10px 0 6px;font-weight:900;letter-spacing:.03em}
.hero .en{font-size:15px;letter-spacing:.14em;color:var(--ink2);font-weight:700}
.lead{color:var(--ink2);margin:14px 0 22px;max-width:36em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:560px}
.fact{border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;background:#fff}
.fact b{display:block;font-size:22px}
.fact span{font-size:12.5px;color:var(--ink2)}
.how{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--ink2)}
.how i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-right:6px}

.app{scroll-margin-top:56px;display:grid;grid-template-columns:390px minmax(0,1fr);height:calc(100vh - 56px);min-height:600px;border-top:2px solid var(--ink)}
.panel{min-width:0;display:flex;flex-direction:column;min-height:0;border-right:2px solid var(--ink);background:var(--paper)}
.panel-head{padding:16px 16px 12px;border-bottom:2px solid var(--ink)}
.search{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:8px 14px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:transparent;min-width:0}
.clear{border:0;background:var(--paper2);border-radius:50%;width:22px;height:22px;line-height:20px;font-size:14px;display:none}
.crumb{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:34px}
.back{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:3px 12px 3px 10px;font-size:13.5px;font-weight:700;display:none}
.back:hover{background:var(--yellow)}
.crumb .title{font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px}
.crumb .title .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 12px "Space Grotesk"}
.crumb .sub{font-size:12.5px;color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:8px 12px 24px;overscroll-behavior:contain}

.zcard{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}
.zcard:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--ink)}
.zcard:active{transform:translateY(2px);box-shadow:none}
.zcard .letter{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:24px}
.zcard .letter.txt{font-size:13px;font-family:"Noto Sans TC";font-weight:900;border-radius:14px;line-height:1.2;text-align:center}
.zcard b{display:block;font-size:16px}
.zcard span{display:block;font-size:12.5px;color:var(--ink2)}
.zcard .go{font-size:20px;font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:12px 4px 4px;line-height:1.6}

.group-h{position:sticky;top:-8px;z-index:1;background:var(--paper);padding:12px 4px 6px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
.group-h .sw{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.group-h small{font-weight:500;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:12px;padding:8px 8px;cursor:pointer}
.item:hover{background:var(--paper2)}
.item[aria-current="true"]{background:#fff;outline:2px solid var(--ink)}
.badge{flex:none;min-width:58px;text-align:center;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:13px;background:var(--zc)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.pending .t b{color:var(--muted);font-weight:500}
.fav{flex:none;border:0;background:transparent;padding:4px;color:var(--beige);font-size:18px;line-height:1}
.fav[aria-pressed="true"]{color:var(--orange)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

.mapwrap{min-width:0;position:relative;overflow:hidden;background:#EDE6D6;touch-action:none;cursor:grab}
.mapwrap.dragging{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;display:none}
.stage.on{display:block}
.stage img{display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage svg{position:absolute;left:0;top:0;overflow:visible}
.hot{fill:transparent;cursor:pointer}
.hot:hover{fill:rgba(224,96,58,.18);stroke:var(--orange);stroke-width:2.5}
.zhit{fill:transparent;stroke:transparent;stroke-width:10;cursor:pointer;transition:fill .2s}
.zhit{stroke-width:4}
.zhit:hover{fill:rgba(255,255,255,.22);stroke:var(--ink);stroke-dasharray:12 8}
.dim{fill:#F7F3E8;fill-opacity:.72;fill-rule:evenodd;pointer-events:none;transition:opacity .3s}
.hit{fill:none;stroke:var(--orange);stroke-width:3.5}
.favmark{fill:var(--orange);stroke:#fff;stroke-width:2}
.sel1{fill:none;stroke:var(--orange);stroke-width:4}
.sel2{fill:none;stroke:var(--orange);stroke-width:3;animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.g-noev{pointer-events:none}
.tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.tools button{width:42px;height:42px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:20px;font-weight:700;box-shadow:var(--shadow);display:grid;place-items:center}
.tools button:active{transform:translateY(2px);box-shadow:none}
.mapbar{position:absolute;left:14px;top:14px;z-index:5;display:flex;align-items:center;gap:8px;max-width:calc(100% - 80px)}
.mapback{display:none;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--yellow);border-radius:999px;padding:5px 14px 5px 10px;font-size:14px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap}
.mapback.show{display:inline-flex}
.mapback:active{transform:translateY(2px);box-shadow:none}
.hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:4px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 14px));display:none}

.card{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:8;width:min(440px,calc(100% - 28px));background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:16px 18px;display:none}
.card.show{display:block;animation:up .22s ease-out}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card .row{display:flex;align-items:flex-start;gap:12px}
.card .logo{flex:none;width:56px;height:56px;border-radius:14px;border:2px solid var(--ink);background:var(--paper2);display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:20px}
.card .logo img{width:100%;height:100%;object-fit:cover}
.card h3{margin:0;font-size:18px;line-height:1.3}
.card .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.card .desc{font-size:14px;color:var(--ink2);margin:10px 0 0}
.card .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card .links a,.card .links button{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;background:#fff}
.card .links a:hover,.card .links button:hover{background:var(--yellow)}
.card .x{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:22px;line-height:1;padding:4px;color:var(--muted)}
.dates{display:flex;gap:6px;margin-top:10px}
.dates span{font:700 12px "Space Grotesk",sans-serif;border:2px solid var(--beige);color:var(--beige);border-radius:999px;padding:1px 9px}
.dates span.on{border-color:var(--ink);color:var(--ink);background:var(--yellow)}
.share{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.share button{border:0;background:none;padding:0;color:var(--orange);font-weight:700;text-decoration:underline;font-size:12.5px}
.days{display:flex;gap:6px;margin-top:10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.days button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:700}
.days button[aria-pressed="true"]{background:var(--ink);color:#fff}
.boothtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.boothtag .sw{width:9px;height:9px;border-radius:50%;background:var(--zc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;z-index:50;display:none}
footer{padding:28px 20px 40px;text-align:center;color:var(--muted);font-size:12.5px;border-top:2px solid var(--ink)}
footer b{color:var(--ink)}
.foot-logo{display:inline-block;height:44px;width:auto;margin-bottom:10px}

@media (max-width:900px){
  .topbar{padding:8px 14px}.meta,.brand small{display:none}
  .brand-logo{height:24px}
  .hero{grid-template-columns:1fr;gap:18px;padding:18px 16px 20px}
  .hero img{max-width:340px;margin:0 auto}
  .fact b{font-size:18px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto;scroll-margin-top:50px}
  .mapwrap{grid-row:1;height:auto;aspect-ratio:2576/1887;max-height:62vh;position:sticky;top:52px;z-index:10;border-bottom:2px solid var(--ink);background:#F3EEE3}
  .mapbar{left:8px;top:8px;gap:6px}
  .mapback{padding:3px 10px 3px 6px;font-size:12.5px}
  .tools{right:8px;top:8px;gap:6px}
  .tools button{width:34px;height:34px;border-radius:10px;font-size:17px}
  .card{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;max-height:52vh;overflow:auto}
  .panel{grid-row:2;border-right:0}
  .list{overflow:visible}
  .card{bottom:10px;padding:14px 16px}
  .hint{font-size:11.5px;padding:2px 10px;background:rgba(255,255,255,.92)}
}
</style>
</head>

    list.innerHTML = ZONES.map(z => `<button class="zcard" data-zone="${z.k}">
        <span class="letter ${z.k==="CB"?"txt":"num"}" style="background:${z.c}">${z.k==="CB"?"小木屋":z.k}</span>
        <span><b>${z.name}　<small style="font-weight:500;color:var(--ink2)">${z.type}</small></b><span>${countZone(z.k)} 個攤位${named(z.k)?`・已公布 ${named(z.k)} 個品牌`:""}</span></span>
        <span class="go">→</span></button>`).join("")
      + `<button class="zcard" data-zone="FAC"><span class="letter txt" style="background:#fff">設施</span><span><b>服務設施</b><span>服務台・集章所・洗手間・遊客中心</span></span><span class="go">→</span></button>`
      + `<button class="zcard" data-zone="FAV"><span class="letter" style="background:#fff;color:var(--orange);font-size:26px">★</span><span><b>我的逛展清單</b><span>${favs.size ? favs.size+" 個收藏" : "點選攤位旁的 ★ 加入"}</span></span><span class="go">→</span></button>`
      + `<p class="note">部分攤位依日期由不同品牌使用，可用上方日期篩選查看當日品牌。<br>配置圖為示意，實際攤位以現場為準。</p>`;
    return;
  }
  if (curZone === "FAC"){
    list.innerHTML = FACILITIES.map(f => `<div class="item" role="button" tabindex="0" data-fac="${f.id}">
      <span class="badge" style="--zc:#fff;font-weight:700">${f.s}</span>
      <span class="t"><b>${f.name}</b><span>${f.pts.length>1 ? f.pts.length+" 處・點選查看位置" : "點選查看位置"}</span></span></div>`).join("")
      + `<p class="note">周邊地標：志開實驗小學・桂子山<br>臨近道路：水交社路・水交社一街・南門路・興中街63巷</p>`;
    return;
  }
  if (curZone === "FAV") return renderRows(entries.filter(e => favs.has(e.key) && onDay(e)), true, "還沒有收藏的攤位<br>點選清單右側的 ★ 加入逛展清單");
  renderRows(entries.filter(e => e.zone === curZone && onDay(e)), false);
}
function matches(e){
  if (!onDay(e)) return false;
  const q = query.toLowerCase(), qu = query.toUpperCase().replace(/\s+/g,"").replace(/^(小木屋|木)/,"CB"), qb = normBooth(query);
  if (e.booths.some(id => (id === qb && query.replace(/\D/g,"").length >= 2) || id.startsWith(qu) || label(id).toLowerCase().includes(q))) return true;
  const b = e.brand; if (!b) return false;
  return [b.name,b.name_en,b.category,b.origin,b.desc].some(v => v && String(v).toLowerCase().includes(q));
}
function renderRows(res, grouped, emptyMsg){
  const list = $("#list");
  if (!res.length){ list.innerHTML = `<div class="empty">${emptyMsg || "找不到符合的品牌或攤位"}</div>`; return; }
  let html = "", g = null;
  res.forEach(e => {
    if (grouped && e.zone !== g){ g = e.zone; const z = zoneObj(g);
      html += `<div class="group-h"><span class="sw" style="background:${z.c}"></span>${z.name}<small>${z.type}・${res.filter(x=>x.zone===g).length}</small></div>`; }
    const z = zoneObj(e.zone), b = e.brand, tags = e.booths.map(label).join("・");
    html += `<div class="item${b?"":" pending"}" role="button" tabindex="0" data-key="${e.key}" aria-current="${selected===e.key}">
      <span class="badge num" style="--zc:${z.fill}">${esc(e.booths.length>1?label(e.booths[0])+"+":label(e.booths[0]))}</span>
      <span class="t"><b>${b?esc(b.name):"本攤位暫無品牌"}</b><span>${b?esc([b.category,b.origin,b.days.length<3?"僅 "+dayText(b.days):""].filter(Boolean).join("・")||tags):(e.booths.length>1?tags+"・":"")+eSub(e.booths[0])}</span></span>
      <button class="fav" data-fav="${e.key}" aria-pressed="${favs.has(e.key)}" aria-label="加入逛展清單">★</button></div>`;
  });
  list.innerHTML = html;
}
$("#list").addEventListener("click", e => {
  const f = e.target.closest("[data-fav]"); if (f){ toggleFav(f.dataset.fav); return; }
  const zc = e.target.closest("[data-zone]"); if (zc){ enterZone(zc.dataset.zone); return; }
  const fc = e.target.closest("[data-fac]"); if (fc){ showFacility(fc.dataset.fac); return; }
  const it = e.target.closest("[data-key]"); if (it) select(it.dataset.key, true);
});
$("#list").addEventListener("keydown", e => {
  if (e.key!=="Enter" && e.key!==" ") return;
  const d = e.target.dataset || {};
  if (d.key){ e.preventDefault(); select(d.key,true); } else if (d.fac){ e.preventDefault(); showFacility(d.fac); }
});
$("#back").onclick = () => toOverview();
function toggleFav(key){
  favs.has(key) ? favs.delete(key) : favs.add(key);
  store.set("mori2026tn-favs", [...favs]); renderPanel(); drawFavs();
  if (selected === key) renderCard();
}

/* ---------- modes ---------- */
/* ---------- 上一頁：記錄瀏覽步驟 ---------- */
const navStack = []; let restoring = false;
const snap = () => ({mode, curZone, selected, fac: curFac});
let curFac = null;
function pushNav(){
  if (restoring) return;
  const s = snap(), t = navStack[navStack.length-1];
  if (t && t.mode === s.mode && t.curZone === s.curZone && t.selected === s.selected && t.fac === s.fac) return;
  navStack.push(s); if (navStack.length > 40) navStack.shift();
}
function navLabel(st){
  if (!st || st.mode === "overview") return "全區地圖";
  if (st.selected){ const e = entries.find(x => x.key === st.selected); return e ? label(e.booths[0]) : "上一頁"; }
  if (st.curZone === "FAC") return "服務設施";
  if (st.curZone === "FAV") return "逛展清單";
  const z = st.curZone && zoneObj(st.curZone); return z ? z.name : "上一頁";
}
function updateBack(){
  const show = mode !== "overview" || !!selected;
  $("#mapBack").classList.toggle("show", show);
  $("#mapBackTxt").textContent = "回" + navLabel(navStack[navStack.length-1]);
}
function goBack(){
  if (query){ $("#q").value = ""; query = ""; $("#clearQ").style.display = "none"; clearHits(); }
  const st = navStack.pop();
  restoring = true;
  try{
    if (!st || st.mode === "overview") toOverview();
    else if (st.fac){ enterZone(st.curZone || "FAC"); showFacility(st.fac); }
    else if (st.selected) select(st.selected, true);
    else if (st.curZone) enterZone(st.curZone);
    else toOverview();
  } finally { restoring = false; }
  updateBack();
}
$("#mapBack").onclick = goBack;
$("#days").addEventListener("click", ev => {
  const b = ev.target.closest("[data-day]"); if (!b) return;
  dayFilter = +b.dataset.day;
  document.querySelectorAll("#days [data-day]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (query) runSearch(); else renderPanel();
  if (selected){ const e = entries.find(x => x.key === selected); if (e && !onDay(e)){ const alt = pickBrand(e.booths[0]); if (alt && alt !== e && onDay(alt)) select(alt.key, false); } }
});

function enterZone(k, fly = true){
  pushNav(); curFac = null;
  mode = "detail"; curZone = k; selected = null; $("#card").classList.remove("show"); clearSel(); clearHits();
  if (k === "FAC" || k === "FAV"){
    showStage("ov"); setDim();
    $("#hint").textContent = k === "FAC" ? "點選左側設施查看位置" : "我的逛展清單";
    if (fly){
      const ids = k === "FAV" ? entries.filter(e => favs.has(e.key)).flatMap(e => e.booths) : [];
      if (ids.length){ const P = ids.map(id => MAPS.ov.pos[id]); fitBox([Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))], 140); }
      else fitAll();
    }
  } else {
    const was = cur; showStage(mapOfZone(k)); setDim();
    $("#hint").textContent = "點選攤位查看品牌";
    if (fly) fitBox(STAGE[cur].m.zones[k], 50, was !== cur, isMobile() && k !== "CB" ? 0.42 : 0);
  }
  renderPanel();
  setHash(k === "FAV" ? "favorites" : k === "FAC" ? "facilities" : "zone-" + k.toLowerCase());
  updateBack();
}
function toOverview(){
  if (!restoring) navStack.length = 0; curFac = null;
  mode = "overview"; curZone = null; selected = null;
  $("#card").classList.remove("show"); clearSel(); clearHits();
  const was = cur; showStage("ov"); setDim(); $("#hint").textContent = "點選分區查看攤位";
  renderPanel(); fitAll(was !== "ov"); setHash(""); updateBack();
}
function setHash(h){ try{ history.replaceState(null, "", h ? "#"+h : location.pathname + location.search); }catch(_){} }

/* ---------- overlays ---------- */
function clearSel(){ Object.values(STAGE).forEach(S => S.g.sel.innerHTML = ""); }
function clearHits(){ Object.values(STAGE).forEach(S => S.g.hit.innerHTML = ""); }
function ring(S, g, id, cls, extra){
  const [x,y] = S.m.pos[id]; const R = S.R + (extra||0);
  const cw = S.R*0.95, ch = S.R*1.4; return id.startsWith("CB") ? el("rect",{x:x-cw-(extra||0),y:y-ch*0.7-(extra||0),width:cw*2+(extra||0)*2,height:ch*2+(extra||0)*2,rx:12,class:cls},g)
                             : el("circle",{cx:x,cy:y,r:R,class:cls},g);
}
function drawFavs(){
  Object.values(STAGE).forEach(S => {
    S.g.fav.innerHTML = "";
    entries.filter(e => favs.has(e.key)).forEach(e => e.booths.forEach(id => { const p = S.m.pos[id]; if (p) el("circle",{cx:p[0]+S.R*0.75,cy:p[1]-S.R*0.75,r:S.R*0.35,class:"favmark"},S.g.fav); }));
  });
}
function showFacility(id){
  const f = FACILITIES.find(x => x.id === id); if (!f) return;
  pushNav(); curFac = id; if (curZone !== "FAC"){ mode = "detail"; curZone = "FAC"; }
  showStage("ov"); clearHits(); clearSel(); $("#card").classList.remove("show");
  f.pts.forEach(([x,y]) => el("circle",{cx:x,cy:y,r:70,class:"hit"},STAGE.ov.g.hit));
  document.querySelectorAll(".item[data-fac]").forEach(n => n.setAttribute("aria-current", n.dataset.fac === id));
  const xs = f.pts.map(p=>p[0]), ys = f.pts.map(p=>p[1]);
  fitBox([Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)], 230); updateBack();
}

/* ---------- search ---------- */
let qt;
$("#q").addEventListener("input", e => {
  query = e.target.value.trim(); $("#clearQ").style.display = query ? "block" : "none";
  clearTimeout(qt); qt = setTimeout(runSearch, 120);
});
function runSearch(){
  clearHits();
  if (!query){ if (curZone) enterZone(curZone, false); else toOverview(); return; }
  const res = entries.filter(matches), ids = [...new Set(res.flatMap(e => e.booths))];
  renderPanel();
  const qn = normBooth(query);
  const exact = /^([A-E]|CB)\d\d$/.test(qn) && query.replace(/\D/g,"").length >= 2 ? entries.find(x => x.booths.includes(qn)) : null;
  if (exact){ select(exact.key, true); return; }
  showStage("ov"); mode = "detail"; curZone = null; setDim();
  $("#hint").textContent = `找到 ${ids.length} 個攤位`; updateBack();
  ids.forEach(id => ring(STAGE.ov, STAGE.ov.g.hit, id, "hit", 2));
  if (ids.length && ids.length < 150){ const P = ids.map(id => MAPS.ov.pos[id]); fitBox([Math.min(...P.map(p=>p[0])),Math.min(...P.map(p=>p[1])),Math.max(...P.map(p=>p[0])),Math.max(...P.map(p=>p[1]))], 120); }
}
$("#clearQ").addEventListener("click", e => { e.preventDefault(); $("#q").value=""; query=""; $("#clearQ").style.display="none"; clearHits();
  if (curZone) enterZone(curZone, false); else toOverview(); });

/* ---------- selection & card ---------- */
function select(key, fly){
  const e = entries.find(x => x.key === key); if (!e) return;
  if (selected !== key) pushNav(); curFac = null;
  const was = cur;
  if (!query && curZone !== "FAV" && curZone !== e.zone){ mode = "detail"; curZone = e.zone; renderPanel(); }
  if (curZone !== "FAV" || !query) { showStage(mapOfZone(e.zone)); }
  if (curZone === e.zone) setDim();
  selected = key; clearSel();
  const S = STAGE[cur];
  e.booths.forEach(id => { if (S.m.pos[id]){ ring(S, S.g.sel, id, "sel1", 3); ring(S, S.g.sel, id, "sel2", 3); } });
  renderCard();
  document.querySelectorAll(".item[data-key]").forEach(n => n.setAttribute("aria-current", n.dataset.key===key));
  const pts = e.booths.map(id => S.m.pos[id]).filter(Boolean);
  if (fly || was !== cur) flyToPts(pts, Math.max(was === cur ? view.s : 0, isMobile() ? 0.8 : 1));
  setHash(e.booths[0].startsWith("CB") ? "W" + e.booths[0].slice(2) : e.booths[0]);
  updateBack();
}
function renderCard(){
  const e = entries.find(x => x.key === selected), card = $("#card");
  if (!e){ card.classList.remove("show"); return; }
  const b = e.brand, z = zoneObj(e.zone);
  const tag = `<span class="boothtag" style="--zc:${z.c}"><i class="sw"></i>${z.name}・<span class="num">${e.booths.map(label).join(" / ")}</span></span>`;
  const links = b ? [["ig","Instagram"],["ig2","Instagram"],["fb","Facebook"],["web","社群連結"]].filter(([k]) => safeUrl(b[k])).map(([k,n]) => `<a href="${esc(safeUrl(b[k]))}" target="_blank" rel="noopener">${n} ↗</a>`).join("") : "";
  const others = sameBooth(e);
  const share = others.length ? `<div class="share">此攤位依日期由不同品牌使用：${others.map(o => `<button data-go="${o.key}">${esc(o.brand.name)}（${dayText(o.brand.days)}）</button>`).join("、")}</div>` : "";
  const dateRow = b ? `<div class="dates">${DAYS.map(d => `<span class="${b.days.includes(d)?"on":""}">11/${d}</span>`).join("")}</div>` : "";
  const hasLogo = b && (safeUrl(b.logo) || /^data:image\//.test(b.logo||""));
  const logo = hasLogo ? `<img src="${esc(b.logo)}" alt="">` : (b ? esc(b.name.slice(0,1)) : "?");
  card.innerHTML = `<button class="x" aria-label="關閉">×</button>${tag}
    <div class="row"><div class="logo">${logo}</div><div style="min-width:0">
      <h3>${b ? esc(b.name) : "本攤位暫無品牌"}</h3>
      <div class="sub">${b ? esc([b.name_en,b.category,b.origin,b.type?b.type+"品牌":""].filter(Boolean).join("・")) : eSub(e.booths[0])}</div></div></div>
    ${dateRow}${share}
    ${b && b.desc ? `<p class="desc">${esc(b.desc)}</p>` : ""}
    <div class="links">${links}
      <button data-act="fav">${favs.has(e.key) ? "★ 已收藏" : "☆ 收藏"}</button>
      <button data-act="link">複製攤位連結</button></div>`;
  card.classList.add("show");
}
$("#card").addEventListener("click", ev => {
  if (ev.target.closest(".x")){ $("#card").classList.remove("show"); selected=null; clearSel();
    document.querySelectorAll(".item[data-key]").forEach(n => n.setAttribute("aria-current", false));
    const t = navStack[navStack.length-1]; if (t && !t.selected && t.curZone === curZone) navStack.pop();
    updateBack(); return; }
  const go = ev.target.closest("[data-go]"); if (go){ select(go.dataset.go, false); return; }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "fav") toggleFav(selected);
  if (a.dataset.act === "link"){
    const e = entries.find(x => x.key === selected), id = e.booths[0];
    const url = location.href.split("#")[0] + "#" + (id.startsWith("CB") ? "W" + id.slice(2) : id);
    try{ navigator.clipboard.writeText(url).then(() => toast("已複製攤位連結"), () => toast("無法複製，請手動複製網址")); }catch(_){ toast("無法複製，請手動複製網址"); }
  }
});

/* ---------- pointer ---------- */
const pointers = new Map(); let pinch = null, moved = false, downAt = null;
wrap.addEventListener("pointerdown", e => {
  if (e.target.closest(".card,.tools,.mapbar")) return;
  wrap.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  moved = false; downAt = {x:e.clientX, y:e.clientY}; cancelAnimationFrame(anim);
  if (pointers.size === 2){ const [a,b] = [...pointers.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y)}; }
});
wrap.addEventListener("pointermove", e => {
  const r = wrap.getBoundingClientRect();
  if (!pointers.has(e.pointerId)){ hover(e, r); return; }
  const p = pointers.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6) moved = true;
  if (pointers.size === 2 && pinch){
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, d / pinch.d); pinch.d = d;
  } else if (pointers.size === 1 && moved){ view.x += dx; view.y += dy; apply(); wrap.classList.add("dragging"); }
});
function up(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  wrap.classList.remove("dragging");
  if (!moved && downAt && pointers.size === 0){
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const id = hit && hit.dataset && hit.dataset.id, zone = hit && hit.dataset && hit.dataset.zone;
    if (id){ const en = pickBrand(id) || entries.find(x => x.key === id); if (en){ if (query){ $("#clearQ").click(); } select(en.key, cur === "ov"); } }
    else if (zone && cur === "ov") enterZone(zone);
  }
  downAt = null;
}
wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
wrap.addEventListener("wheel", e => { e.preventDefault(); const r = wrap.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY * 0.0018)); }, {passive:false});
wrap.addEventListener("pointerleave", () => $("#tip").style.display = "none");
function hover(e, r){
  const tip = $("#tip"), d = e.target.dataset || {};
  if (d.id){ const a = (brandByBooth[d.id] || []).filter(onDay); tip.innerHTML = `<b class="num">${label(d.id)}</b>　${a.length ? a.map(x => esc(x.brand.name) + (x.brand.days.length < 3 ? `（${dayText(x.brand.days)}）` : "")).join(" / ") : "暫無品牌"}`; }
  else if (d.zone){ const z = zoneObj(d.zone); tip.innerHTML = `<b>${z.name}</b>　${z.type}・點選查看`; }
  else { tip.style.display = "none"; return; }
  tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px"; tip.style.display = "block";
}
$("#zin").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1.5);
$("#zout").onclick = () => zoomAt(wrap.clientWidth/2, wrap.clientHeight/2, 1/1.5);
$("#zfit").onclick = () => { if (mode === "detail" && curZone && ZONES.some(z => z.k === curZone) && !query) fitBox(STAGE[cur].m.zones[curZone], 50, false, isMobile() && curZone !== "CB" ? 0.42 : 0); else toOverview(); };
$("#jumpBtn").onclick = () => $("#app").scrollIntoView({behavior:"smooth"});
addEventListener("resize", () => apply());

/* ---------- init ---------- */
STAGE.ov.el.classList.add("on");
renderPanel(); drawFavs();
requestAnimationFrame(() => { fitAll(true); openHash(); });
function openHash(){
  const h = decodeURIComponent(location.hash.slice(1)); if (!h) return;
  if (h === "favorites"){ $("#app").scrollIntoView(); return enterZone("FAV"); }
  if (h === "facilities"){ $("#app").scrollIntoView(); return enterZone("FAC"); }
  const zm = h.match(/^zone-(a|b|c|d|e|cb)$/i); if (zm){ $("#app").scrollIntoView(); return enterZone(zm[1].toUpperCase()); }
  const id = normBooth(h.replace(/^W(\d)/i,"CB$1")), en = pickBrand(id) || entries.find(x => x.key === id);
  if (en){ $("#app").scrollIntoView(); setTimeout(() => select(en.key, true), 60); }
}
addEventListener("hashchange", openHash);
</script>
</body>
</html>
